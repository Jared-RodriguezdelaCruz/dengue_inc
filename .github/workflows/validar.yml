name: Validar

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validar:
    name: Validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar scripts, index.html y datos del dengue
        run: node .github/scripts/validar.mjs

  titulo:
    name: Título del PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: El título sigue Conventional Commits
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          echo "Título: $TITULO"
          if printf '%s' "$TITULO" | grep -Eqi '^((feat|fix|docs|style|refactor|perf|test|chore|ci)(\([a-z0-9-]+\))?!?: .+|(feat|fix|docs|style|refactor|perf|test|chore|ci)(/[a-z0-9-]+) .+)$'; then
            echo "✅ Formato correcto"
          else
            echo "::error::El título debe ser 'tipo(área): descripción' (ej. 'feat(audio): tema del menú (DI-404)') o 'tipo/área descripción' (ej. 'fix/rendimiento ultimos commits'). Tipos: feat, fix, docs, style, refactor, perf, test, chore, ci."
            exit 1
          fi
