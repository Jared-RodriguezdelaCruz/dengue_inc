name: Publicar en GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    publicar:
        name: Publicar
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4

            - name: Armar el sitio con cache-busting
              run: |
                  rsync -a --exclude='.git*' --exclude='_site' --exclude='docs' --exclude='*.md' ./ _site/
                  V="${GITHUB_SHA::7}"
                  sed -i -E "s/\?v=[A-Za-z0-9._-]+/?v=$V/g" _site/index.html
                  sed -i -E "s/^const BUILD = '[^']*';/const BUILD = '$(date -u +%Y-%m-%d) · $V';/" _site/js/01-nucleo.js
                  echo "Versión publicada: $V"
                  grep -m1 "const BUILD" _site/js/01-nucleo.js

            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: _site
            - id: deploy
              uses: actions/deploy-pages@v4
